<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu Kit Mary Care</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html{-webkit-text-size-adjust:100%}
/* Layout: tarjeta central tipo app; el bolsito Mary Care es el personaje que acompaña todo el recorrido */
:root{
  --vino:#8E2A5C; --rosa:#E8A0A8; --fondo:#F6F3F6; --tinta:#2E1626; --suave:#7A5E70;
  --tarjeta:#FFFFFF; --linea:#EADCE5; --rosa-claro:#FBEFF2; --crema:#FBF5EE; --raya:#F3B3C1; --raya2:#A3294F;
  --f:'Gabarito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--fondo);color:var(--tinta)}
body{font-family:var(--f);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 40px;min-height:100%;overflow-x:hidden}
#burbujas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px}
.mono{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--linea);display:grid;place-items:center;font-weight:800;color:var(--vino)}
.marca b{display:block;font-size:15px;letter-spacing:.14em;color:var(--vino)}
.marca small{display:block;font-size:12px;color:var(--suave)}
.paso{font-size:13px;color:var(--suave);font-variant-numeric:tabular-nums}
.barra{height:8px;background:var(--linea);border-radius:99px;overflow:hidden;position:relative}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vino),var(--rosa));border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.barra i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:brillo 1.8s ease-in-out infinite}
@keyframes brillo{to{transform:translateX(100%)}}

/* Bolsito */
.bolso{display:block;width:100%;height:auto;overflow:visible}
.bolso .flota{animation:flota 3.2s ease-in-out infinite;transform-origin:100px 140px}
@keyframes flota{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.bolso .borla{transform-origin:24px 34px;animation:borla 2.4s ease-in-out infinite}
@keyframes borla{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-10deg)}}
.bolso .lazo{transform-origin:138px 62px;animation:lazo 3.2s ease-in-out infinite}
@keyframes lazo{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Portada */
.hero{background:linear-gradient(150deg,var(--vino) 0%,#B44E7C 55%,var(--rosa) 100%);color:#fff;border-radius:28px;padding:26px 22px 28px;position:relative;overflow:hidden}
.hero .bolso-wrap{width:min(240px,62%);margin:4px auto 10px;filter:drop-shadow(0 18px 22px rgba(60,10,35,.35))}
.hero h1{font-size:clamp(28px,7.2vw,40px);line-height:1.06;margin:0 0 10px;font-weight:800;text-wrap:balance;text-align:center}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(18px);animation:sube .6s cubic-bezier(.2,.8,.2,1) forwards}
.hero p{margin:0 auto 18px;opacity:.94;max-width:36ch;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.chips span{font-size:13px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);padding:5px 12px;border-radius:99px;animation:aparece .5s ease both}
.hero .cta{display:flex;justify-content:center}
@keyframes sube{to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.destello{position:absolute;width:10px;height:10px;pointer-events:none;animation:titila 2.6s ease-in-out infinite}
.destello::before,.destello::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.destello::before{width:2px;height:100%}.destello::after{width:100%;height:2px}
@keyframes titila{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}

.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:16px;padding:15px 24px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease;position:relative;overflow:hidden}
.btn:focus-visible,.op:focus-visible{outline:3px solid var(--rosa);outline-offset:3px}
.btn-blanco{background:#fff;color:var(--vino);box-shadow:0 8px 20px -8px rgba(60,10,35,.5);animation:late 2.4s ease-in-out 1.6s infinite}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.btn-blanco svg{transition:transform .2s}.btn-blanco:hover svg{transform:translateX(4px)}
.btn-vino{background:var(--vino);color:#fff}
.btn-borde{background:#fff;color:var(--vino);border:1.5px solid var(--linea)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}

/* Preguntas */
.escena{position:relative}
.card{background:var(--tarjeta);border-radius:24px;padding:24px 20px;box-shadow:0 14px 40px -20px rgba(142,42,92,.4)}
.entra{animation:entraDer .45s cubic-bezier(.2,.8,.2,1) both}
.sale{animation:saleIzq .3s ease-in both}
.entraAtras{animation:entraIzq .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes entraDer{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes entraIzq{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes saleIzq{to{opacity:0;transform:translateX(-40px) scale(.98)}}
.q .num{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--vino);background:var(--rosa-claro);padding:4px 10px;border-radius:99px;margin-bottom:10px}
.q h2{font-size:clamp(22px,5.6vw,28px);line-height:1.18;margin:0 0 6px;font-weight:800;text-wrap:balance}
.q .ayuda{color:var(--suave);margin:0 0 18px;font-size:15px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ops.una{grid-template-columns:1fr}
.op{font:inherit;text-align:left;background:var(--rosa-claro);border:2px solid transparent;border-radius:18px;padding:16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--tinta);transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s,background .2s,box-shadow .2s;min-width:0;position:relative;overflow:hidden;opacity:0;animation:opIn .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes opIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.ops.una .op{flex-direction:row;align-items:center}
.op:hover{transform:translateY(-3px);border-color:var(--rosa);box-shadow:0 10px 20px -12px rgba(142,42,92,.5)}
.op:hover .ic svg{animation:menea .5s ease}
@keyframes menea{25%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}
.ops:not(.una) .op:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center}
.op.sel{opacity:1;border-color:var(--vino);background:#fff;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.95)}100%{transform:scale(1)}}
.op .ic{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;color:var(--vino);transition:background .2s,color .2s}
.op.sel .ic{background:var(--vino);color:#fff}
.op b{font-weight:600;font-size:15.5px;line-height:1.25}
.op small{display:block;color:var(--suave);font-size:13px;line-height:1.3;margin-top:2px}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.check{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--vino);display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.op.sel .check{transform:scale(1)}
.check svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20}
.op.sel .check svg{animation:traza .35s .12s ease forwards}
@keyframes traza{to{stroke-dashoffset:0}}
.onda{position:absolute;border-radius:50%;background:rgba(142,42,92,.18);transform:scale(0);animation:onda .6s ease-out forwards;pointer-events:none}
@keyframes onda{to{transform:scale(4);opacity:0}}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.atras{font:inherit;background:none;border:0;color:var(--suave);cursor:pointer;padding:8px 4px;font-size:14px}
.atras:hover{color:var(--vino)}

/* Armando el kit */
.armando{text-align:center;padding:30px 20px 28px}
.armando h2{margin:0 0 4px;font-size:24px;font-weight:800;color:var(--vino)}
.armando p{margin:0;color:var(--suave)}
.mesa{position:relative;width:min(260px,80%);margin:18px auto 8px;padding-top:120px}
.mesa .bolso-wrap{position:relative;z-index:2}
.cae{position:absolute;left:50%;top:0;z-index:1;transform:translate(-50%,-30px);opacity:0;white-space:nowrap;font-size:13px;font-weight:600;background:#fff;color:var(--vino);border:1.5px solid var(--rosa);border-radius:99px;padding:6px 12px;box-shadow:0 6px 14px -8px rgba(142,42,92,.6);animation:cae .9s cubic-bezier(.55,0,.6,1) forwards}
@keyframes cae{0%{opacity:0;transform:translate(-50%,-30px) rotate(-6deg)}20%{opacity:1;transform:translate(-50%,10px) rotate(4deg)}70%{opacity:1;transform:translate(-50%,105px) scale(.8) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,150px) scale(.4)}}
.mesa.rebota .bolso-wrap{animation:rebota .3s ease}
@keyframes rebota{40%{transform:scaleY(.94) scaleX(1.04)}}
.contador{font-size:14px;color:var(--suave);font-variant-numeric:tabular-nums;margin-top:6px}
.saltar{font:inherit;background:none;border:0;color:var(--suave);text-decoration:underline;cursor:pointer;font-size:13px;margin-top:10px}

/* Resultado */
.res{display:flex;flex-direction:column;gap:16px}
.res > *{opacity:0;animation:sube .55s cubic-bezier(.2,.8,.2,1) forwards}
.res-top{background:linear-gradient(150deg,var(--vino),#B44E7C 60%,var(--rosa));color:#fff;border-radius:26px;padding:22px 22px 24px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center}
.res-top .eti{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.res-top h2{font-size:clamp(28px,7.6vw,40px);line-height:1.05;margin:6px 0 8px;font-weight:800}
.res-top p{margin:0;opacity:.95;font-size:15px}
.res-top .mini-bolso{filter:drop-shadow(0 10px 14px rgba(60,10,35,.35))}
@media (max-width:380px){.res-top{grid-template-columns:1fr}.res-top .mini-bolso{display:none}}
.sec h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--vino);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec h3 .pill{font-size:11px;letter-spacing:.06em;background:var(--vino);color:#fff;border-radius:99px;padding:2px 8px}
.prod{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod div{background:var(--rosa-claro);border-radius:14px;padding:12px;opacity:0;animation:opIn .45s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .2s}
.prod div:hover{transform:translateY(-2px) rotate(-.5deg)}
.prod div:last-child:nth-child(odd){grid-column:1/-1}
.prod.tuyos div{background:#fff;border:2px solid var(--rosa)}
.prod b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.prod small{color:var(--suave);font-size:12.5px}
.expl{margin:12px 0 0;font-size:14px;color:var(--suave)}
.rutina{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:r}
.rutina li{display:flex;gap:12px;align-items:flex-start;counter-increment:r}
.rutina li::before{content:counter(r);width:28px;height:28px;border-radius:50%;background:var(--vino);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.codigo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:2px dashed var(--rosa);border-radius:18px;padding:16px 18px;background:#fff}
.codigo b{font-size:24px;letter-spacing:.08em;color:var(--vino);font-variant-numeric:tabular-nums}
.codigo small{display:block;color:var(--suave);font-size:13px}
.nota{font-size:12.5px;color:var(--suave);text-align:center;margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.ops{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.campo label{font-size:14px;font-weight:600}
.campo label small{font-weight:400;color:var(--suave)}
.campo input{font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:2px solid var(--linea);background:var(--rosa-claro);color:var(--tinta);outline:none;transition:border-color .2s,background .2s;width:100%}
.campo input:focus{border-color:var(--vino);background:#fff}
.campo input.cod{text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--vino)}
.err{color:#B3261E;font-size:14px;margin:0 0 12px;min-height:1px}
.err:empty{display:none}
.btn-full{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.listo{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--rosa);border-radius:20px;padding:16px 18px}
.listo .ok{flex:none;width:44px;height:44px;border-radius:50%;background:var(--vino);display:grid;place-items:center}
.listo .ok svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.listo b{display:block;font-size:16px}
.listo span{color:var(--suave);font-size:14px}
</style>
</head>
<body>

<canvas id="burbujas" aria-hidden="true"></canvas>
<canvas id="confeti" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="marca"><div class="mono">MC</div><div><b>MARYCARE</b><small>Este momento es tuyo</small></div></div>
    <span class="paso" id="paso"></span>
  </header>
  <div class="barra" id="barraBox" hidden><i id="barra"></i></div>
  <main id="app" class="escena"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const I = {
  gift:'<path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 21V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  drop:'<path d="M12 2.7s7 7.3 7 12.3a7 7 0 0 1-14 0c0-5 7-12.3 7-12.3z"/>',
  shine:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  desert:'<path d="M3 20h18"/><path d="M6 20c1-4 3-6 6-6s5 2 6 6"/><path d="M8 9l1-1M16 9l-1-1M12 6V4"/>',
  balance:'<path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0z"/><path d="M19 7l-3 7a3 3 0 0 0 6 0z"/>',
  smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9.5h.01M15 9.5h.01"/>',
  dots:'<circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="13" cy="14.5" r="1"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.4 5.1-6"/>',
  lines:'<path d="M4 8c3-2 5-2 8 0s5 2 8 0"/><path d="M4 14c3-2 5-2 8 0s5 2 8 0"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  cloud:'<path d="M17.5 19H8a6 6 0 1 1 5.7-7.9A4.5 4.5 0 1 1 17.5 19z"/>',
  home:'<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;

const SB_URL = 'https://dzwvvtqvmwpkgzgkknaj.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6d3Z2dHF2bXdwa2d6Z2trbmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwMjAsImV4cCI6MjA5NTY3MjAyMH0.uxDyOKN8f7iTq8c2S1DbaLQRGx1qnZCfQFUP2mU9YIc';
async function rpc(fn, body){
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
const escH = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let codigoURL = '';
try { codigoURL = (new URLSearchParams(location.search).get('c') || '').toUpperCase().slice(0, 20); } catch(e) {}
let cliente = { codigo: codigoURL, nombre: '', telefono: '' };
const REDUCIR = matchMedia('(prefers-reduced-motion: reduce)').matches;

function bolsoSVG(id){
  return `<svg class="bolso" viewBox="0 0 200 160" role="img" aria-label="Bolsito Mary Care">
  <defs>
    <pattern id="rayas${id}" width="26" height="10" patternUnits="userSpaceOnUse">
      <rect width="26" height="10" fill="#F3B3C1"/><rect x="15" width="9" height="10" fill="#A3294F"/><rect x="2" width="2" height="10" fill="#F8C9D3"/>
    </pattern>
    <linearGradient id="som${id}" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
  </defs>
  <g class="flota">
    <path d="M18 44 Q18 32 30 32 H170 Q182 32 182 44 L174 138 Q173 150 160 150 H40 Q27 150 26 138 Z" fill="url(#rayas${id})"/>
    <path d="M18 44 Q18 32 30 32 H170 Q182 32 182 44 L174 138 Q173 150 160 150 H40 Q27 150 26 138 Z" fill="url(#som${id})"/>
    <rect x="22" y="28" width="156" height="8" rx="4" fill="#7A1F3D"/>

const FIJOS = [
  ['Ampolla Flash','MartiDerm · luz e hidratación al instante'],
  ['Agua termal en spray','Uriage · hidrata y calma'],
  ['Bálsamo de labios y mejillas SPF 50','BABE · color y protección'],
  ['Desmaquillante de ojos y labios','Germaine de Capuccini']
];
const LIMP = {
  grasa:{l:['Gel limpiador para granitos','BABE Stop AKN · quita el brillo'], s:['Muestra de protector solar con color','BABE · matificante']},
  otra:{l:['Gel limpiador','Germaine de Capuccini · todo tipo de piel'], s:['Muestra de protector solar en leche','Germaine de Capuccini · hidratante']}
};
const MASC = {
  anua:{m:['Mascarilla hidratante','Anua · hidrata y calma'], t:'hidratar y calmar', n:'Hidratación'},
  med:{m:['Mascarilla rosada para el tono','Medicube · luz y tono parejo'], t:'luz y tono parejo', n:'Luz'}
};

let ans = {};
const Q = () => {
  const r = ans.para !== 'regalo';
  const s = r ? 'tu' : 'su';
  return [
    {id:'para',t:`${escH(cliente.nombre.split(' ')[0])}, ¿para quién es el kit?`,h:'Son 3 preguntas. Toma menos de un minuto.',one:true,o:[
      ['mi','Para mí','Me toca consentirme','user'],
      ['regalo','Es un regalo','Para alguien especial','gift']]},
    {id:'piel',t:`Al final del día, ¿cómo se siente ${s} piel?`,h:'Piensa en un día normal, sin maquillaje.',o:[
      ['grasa','Brillosa o con granitos','Sobre todo en frente y nariz','drop'],
      ['seca','Reseca o tirante','Pide crema todo el tiempo','desert'],
      ['mixta','Mixta','Brilla en el centro, seca en mejillas','balance'],
      ['sensible','Sensible','Se pone roja fácil','leaf'],
      ['normal','Bien, sin quejas','Ni grasa ni seca','smile'],
      ...(r?[]:[['nose','No estoy seguro','No sé su tipo de piel','help']])]},
    {id:'meta',t:`¿Qué ${r?'quieres':'quiere'} lograr?`,h:'Escoge lo que más te gustaría ver en el espejo.',one:true,o:[
      ['anua','Piel hidratada y en calma','Suave, fresca, sin tirantez','drop'],
      ['med','Piel con luz y tono parejo','Menos apagada, más brillo sano','shine']]}

};

let i = -1;
const app = document.getElementById('app');
const flecha = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const visto = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function cambiar(render, atras){
  const actual = app.firstElementChild;
  if (!actual || REDUCIR) { render(); return; }
  actual.classList.add('sale');
  setTimeout(()=>{ render(atras); }, 260);
}

function portada(){
  document.getElementById('barraBox').hidden = true;
  document.getElementById('paso').textContent = '';
  const titulo = 'Arma tu kit Mary Care a la medida de tu piel'.split(' ')
    .map((w,k)=>`<span style="animation-delay:${.15+k*.07}s">${w}</span>`).join(' ');
  const dest = [[12,18,0],[84,14,.8],[90,46,1.6],[8,52,2.1],[70,30,.4]]
    .map(([x,y,d])=>`<i class="destello" style="left:${x}%;top:${y}%;animation-delay:${d}s"></i>`).join('');
  app.innerHTML = `<section class="hero entra">${dest}
    <div class="bolso-wrap">${bolsoSVG('h')}</div>
    <h1>${titulo}</h1>
    <p>Gracias por tu compra. Contesta 3 preguntas y armamos tu bolsito con los productos para tu piel.</p>
    <div class="chips"><span style="animation-delay:.9s">1 minuto</span><span style="animation-delay:1s">3 preguntas</span><span style="animation-delay:1.1s">Hecho para tu piel</span></div>
    <div class="cta"><button class="btn btn-blanco" id="empezar">Empezar ${flecha}</button></div>
  </section>`;
  document.getElementById('empezar').onclick = () => cambiar(datos);
}

function datos(atras){
  document.getElementById('barraBox').hidden = false;
  requestAnimationFrame(()=>{ document.getElementById('barra').style.width = '6%'; });
  document.getElementById('paso').textContent = 'Antes de empezar';
  app.innerHTML = `<section class="card q ${atras?'entraAtras':'entra'}">
    <span class="num">Antes de empezar</span>
    <h2>Tu código de compra</h2>
    <p class="ayuda">Mary Care te lo envió por WhatsApp cuando pagaste tu kit.</p>
    <form id="fDatos" novalidate>
      <div class="campo"><label for="fCod">Código</label><input id="fCod" class="cod" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MC-XXXXXX" maxlength="20" value="${escH(cliente.codigo)}"></div>
      <div class="campo"><label for="fNom">Tu nombre</label><input id="fNom" autocomplete="name" placeholder="Nombre y apellido" maxlength="80" value="${escH(cliente.nombre)}"></div>
      <div class="campo"><label for="fTel">Tu WhatsApp <small>(opcional, para avisarte cuando esté listo)</small></label><input id="fTel" type="tel" autocomplete="tel" inputmode="tel" placeholder="809 000 0000" maxlength="20" value="${escH(cliente.telefono)}"></div>
      <p class="err" id="fErr"></p>
      <button class="btn btn-vino btn-full" id="fBtn" type="submit">Continuar ${flecha}</button>
    </form>
    <div class="nav"><button class="atras" id="atras">← Atrás</button></div>
  </section>`;
  document.getElementById('atras').onclick = () => cambiar(portada);
  document.getElementById('fDatos').onsubmit = async (ev) => {
    ev.preventDefault();
    const err = document.getElementById('fErr'), btn = document.getElementById('fBtn');
    const cod = document.getElementById('fCod').value.trim().toUpperCase().replace(/\s+/g,'');
    const nom = document.getElementById('fNom').value.trim();
    const tel = document.getElementById('fTel').value.trim();
    err.textContent = '';
    if (!cod) { err.textContent = 'Escribe el código que te envió Mary Care.'; return; }
    if (nom.length < 2) { err.textContent = 'Escribe tu nombre.'; return; }
    btn.disabled = true; btn.firstChild.textContent = 'Verificando… ';
    let r;
    try { r = await rpc('kit_verificar', { p_codigo: cod }); }
    catch(e) { btn.disabled = false; btn.firstChild.textContent = 'Continuar '; err.textContent = 'No hay conexión. Revisa tu internet e inténtalo otra vez.'; return; }
    btn.disabled = false; btn.firstChild.textContent = 'Continuar ';
    if (r === 'no_existe') { err.textContent = 'Ese código no existe. Revisa que esté bien escrito, o escríbele a Mary Care.'; return; }
    if (r === 'usado') { err.textContent = 'Este código ya se usó. Si crees que es un error, escríbele a Mary Care.'; return; }
    if (r !== 'ok') { err.textContent = 'No pudimos verificar el código. Inténtalo otra vez.'; return; }
    cliente = { codigo: cod, nombre: nom, telefono: tel };
    i = 0; cambiar(pregunta);
  };
}

function pregunta(atras){
  const qs = Q(), q = qs[i];
  document.getElementById('barraBox').hidden = false;
  requestAnimationFrame(()=>{ document.getElementById('barra').style.width = ((i+.5)/qs.length*100)+'%'; });
  document.getElementById('paso').textContent = `Pregunta ${i+1} de ${qs.length}`;
  app.innerHTML = `<section class="card q ${atras?'entraAtras':'entra'}">
    <span class="num">Pregunta ${i+1}</span>
    <h2>${q.t}</h2><p class="ayuda">${q.h}</p>
    <div class="ops ${q.one?'una':''}">${q.o.map(([v,b,s,ic],k)=>`
      <button class="op ${ans[q.id]===v?'sel':''}" data-v="${v}" id="op-${q.id}-${v}" style="animation-delay:${.12+k*.07}s">
        <span class="ic">${svg(ic)}</span><span><b>${b}</b><small>${s}</small></span><span class="check">${visto}</span></button>`).join('')}
    </div>
    <div class="nav"><button class="atras" id="atras">← Atrás</button></div>
  </section>`;
  let bloqueado = false;
  app.querySelectorAll('.op').forEach(b => b.onclick = (ev) => {
    if (bloqueado) return; bloqueado = true;
    app.querySelectorAll('.op').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    const r = b.getBoundingClientRect(), d = Math.max(r.width,r.height)/2;
    const o = document.createElement('span'); o.className='onda';
    o.style.cssText = `width:${d}px;height:${d}px;left:${(ev.clientX||r.left+r.width/2)-r.left-d/2}px;top:${(ev.clientY||r.top+r.height/2)-r.top-d/2}px`;
    b.appendChild(o);
    ans[q.id] = b.dataset.v;
    if (q.id === 'para' && b.dataset.v === 'mi' && ans.piel === 'nose') delete ans.piel;
    setTimeout(()=>{ i++; i < Q().length ? cambiar(pregunta) : cambiar(armando); }, REDUCIR ? 50 : 420);
  });
  document.getElementById('atras').onclick = () => { i--; i < 0 ? cambiar(datos, true) : cambiar(pregunta, true); };
}

function kitElegido(){
  const L = LIMP[ans.piel === 'grasa' ? 'grasa' : 'otra'], M = MASC[ans.meta];
  return {L, M, todos:[L.l, M.m, L.s, ...FIJOS]};
}

function armando(){
  document.getElementById('barra').style.width = '100%';
  document.getElementById('paso').textContent = 'Armando tu kit';
  const {todos} = kitElegido();
  const envio = enviarPedido();
  if (REDUCIR) { envio.then(fin => fin ? resultado() : errorEnvio()); return; }
  app.innerHTML = `<section class="card armando entra">
    <h2>Armando ${ans.para==='regalo'?'el':'tu'} kit…</h2><p>Escogiendo los productos para ${ans.para==='regalo'?'su':'tu'} piel</p>
    <div class="mesa" id="mesa"><div class="bolso-wrap">${bolsoSVG('a')}</div></div>
    <div class="contador" id="cont">0 de ${todos.length} productos</div>
    <button class="saltar" id="saltar">Ver resultado ya</button>
  </section>`;
  const mesa = document.getElementById('mesa'), cont = document.getElementById('cont');
  let n = 0, fin = false;
  const timers = [];
  const terminar = () => { if (fin) return; fin = true; timers.forEach(clearTimeout);
    envio.then(ok => { if (ok) { cambiar(resultado); setTimeout(lanzarConfeti, 350); } else cambiar(errorEnvio); }); };
  todos.forEach(([nombre], k) => {
    timers.push(setTimeout(()=>{
      const c = document.createElement('span'); c.className = 'cae'; c.textContent = nombre;
      mesa.appendChild(c);
      timers.push(setTimeout(()=>{ n++; cont.textContent = `${n} de ${todos.length} productos`;
        mesa.classList.remove('rebota'); void mesa.offsetWidth; mesa.classList.add('rebota'); c.remove(); }, 820));
    }, 300 + k*420));
  });
  timers.push(setTimeout(terminar, 300 + todos.length*420 + 900));
  document.getElementById('saltar').onclick = terminar;
}

let envioRes = null;
async function enviarPedido(){
  try {
    const r = await rpc('kit_canjear', { p_codigo: cliente.codigo, p_nombre: cliente.nombre, p_telefono: cliente.telefono || null, p_para: ans.para, p_piel: ans.piel, p_meta: ans.meta });
    envioRes = r; return r === 'ok';
  } catch(e) { envioRes = 'red'; return false; }
}
function errorEnvio(){
  const msg = envioRes === 'usado' ? 'Este código ya se usó para otro kit. Escríbele a Mary Care para revisarlo.'
    : envioRes === 'no_existe' ? 'El código ya no es válido. Escríbele a Mary Care.'
    : 'No pudimos enviar tu pedido. Revisa tu internet y toca Reintentar. Tus respuestas siguen guardadas.';
  document.getElementById('paso').textContent = 'Falta un paso';
  app.innerHTML = `<section class="card q entra"><span class="num">Falta un paso</span><h2>Tu pedido no se envió</h2><p class="ayuda">${msg}</p>
    ${envioRes === 'red' || envioRes === 'datos' || envioRes === 'nombre' ? '<button class="btn btn-vino btn-full" id="reint">Reintentar</button>' : ''}</section>`;
  const b = document.getElementById('reint');
  if (b) b.onclick = async () => { b.disabled = true; b.textContent = 'Enviando…'; const ok = await enviarPedido(); ok ? (cambiar(resultado), setTimeout(lanzarConfeti, 350)) : cambiar(errorEnvio); };
}

    <section class="card sec" ${d(2)}><h3>Van en todos los kits <span class="pill">4</span></h3><div class="prod">${FIJOS.map((x,k)=>fila(x,k+3)).join('')}</div></section>
    <section class="card sec" ${d(3)}><h3>Cómo usarlo</h3><ol class="rutina">
      <li><span>Desmaquilla ojos y labios y lava la cara con el gel limpiador.</span></li>
      <li><span>Rocía el agua termal cuando sientas la piel caliente o reseca.</span></li>
      <li><span>Usa la mascarilla y la Ampolla Flash cuando quieras darle un extra a la piel, como indica el empaque.</span></li>
      <li><span>Antes de salir, el protector solar en la cara y el bálsamo en labios y mejillas.</span></li></ol></section>
    <div class="listo" ${d(4)}><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div><b>¡Pedido recibido, ${escH(cliente.nombre.split(' ')[0])}!</b><span>Mary Care ya tiene tus respuestas y va a armar tu kit. Código ${escH(cliente.codigo)}.</span></div></div>
    <p class="nota" ${d(5)}>Puedes cerrar esta página. Te avisaremos cuando tu kit esté listo.</p>
  </div>`;
  window.scrollTo({top:0,behavior:REDUCIR?'auto':'smooth'});
}

function aviso(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2200); }

/* Burbujas de fondo */
(function(){
  const cv = document.getElementById('burbujas'), cx = cv.getContext('2d');
  let W, H, B = [];
  const tam = () => { const dpr = devicePixelRatio||1; W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); };
  tam(); addEventListener('resize', tam);
  for (let k=0;k<18;k++) B.push({x:Math.random()*W, y:Math.random()*H, r:6+Math.random()*22, v:.15+Math.random()*.35, f:Math.random()*6.28, c:k%3});
  const col = ['rgba(232,160,168,.22)','rgba(142,42,92,.10)','rgba(255,255,255,.55)'];
  const dibuja = () => {
    cx.clearRect(0,0,W,H);
    B.forEach(b=>{
      if (!REDUCIR){ b.y -= b.v; b.f += .01; if (b.y < -40){ b.y = H+40; b.x = Math.random()*W; } }
      const x = b.x + Math.sin(b.f)*14;
      cx.beginPath(); cx.arc(x,b.y,b.r,0,6.283); cx.fillStyle = col[b.c]; cx.fill();
      cx.beginPath(); cx.arc(x-b.r*.35,b.y-b.r*.35,b.r*.22,0,6.283); cx.fillStyle='rgba(255,255,255,.5)'; cx.fill();
    });
    if (!REDUCIR) requestAnimationFrame(dibuja);
  };
  dibuja();
})();

/* Confeti */
function lanzarConfeti(cant){
  if (REDUCIR) return;
  const cv = document.getElementById('confeti'), cx = cv.getContext('2d');
  const dpr = devicePixelRatio||1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#8E2A5C','#E8A0A8','#F3B3C1','#C9A24B','#FFFFFF','#B44E7C'];
  const P = Array.from({length:cant||140}, () => ({
    x: W/2 + (Math.random()-.5)*60, y: H*.32, vx:(Math.random()-.5)*12, vy:-Math.random()*13-4,
    w:6+Math.random()*6, h:8+Math.random()*8, r:Math.random()*6.28, vr:(Math.random()-.5)*.3,
    c:cols[Math.floor(Math.random()*cols.length)], corazon: Math.random()<.18 }));
  let t = 0;
  const paso = () => {
    t++; cx.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      if (p.corazon){ const s=p.w*.9; cx.beginPath(); cx.moveTo(0,s*.3); cx.bezierCurveTo(-s,-s*.4,-s*.4,-s,0,-s*.4); cx.bezierCurveTo(s*.4,-s,s,-s*.4,0,s*.3); cx.fill(); }
      else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));
      cx.restore();
    });
    if (t < 200) requestAnimationFrame(paso); else cx.clearRect(0,0,W,H);
  };
  paso();
}
